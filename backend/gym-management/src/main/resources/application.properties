# ─── File Upload ──────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Uploaded images are stored in uploads/ (relative to working directory)
# and served at http://localhost:8080/uploads/... via WebMvcConfig

# ─── Logging ─────────────────────────────────────────────────
# Root level — only WARN and above from third-party libraries
logging.level.root=WARN

# Application packages — INFO shows all business-action logs
logging.level.com.gymmanagement.gym_management=INFO

# HTTP filter — INFO to see every request/response line
logging.level.com.gymmanagement.gym_management.filter=INFO

# Set to DEBUG to also see dashboard/list/read operations
# logging.level.com.gymmanagement.gym_management=DEBUG

# Log pattern — timestamp | level | logger (short) | message
logging.pattern.console=%d{HH:mm:ss.SSS} %highlight(%-5level) %cyan(%-30.30logger{29}) : %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %-30.30logger{29} : %msg%n

# Optional: write logs to a file as well
# logging.file.name=logs/gym-management.log
