# ─── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Hibernate 7 auto-detects PostgreSQL — no need to set dialect explicitly (removes HHH90000025 warning)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Disable open-in-view — this is a REST API, not a template-rendered app (removes spring.jpa.open-in-view warning)
spring.jpa.open-in-view=false

